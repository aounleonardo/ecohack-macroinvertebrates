[build]
  base = "web"
  # prebuild runs etl (sites/taxa/series) but NOT build_river_reaches — needs local OSM cache.
  # Coloured reaches come from committed web/public/data/river_reaches.geojson (OSM-snapped).
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Baked into the client bundle; override in Netlify UI if the Render URL changes.
  VITE_API_URL = "https://ecohack-macroinvertebrates.onrender.com"

# Same-origin /api/* for builds that omit VITE_API_URL (proxy to Render).
[[redirects]]
  from = "/api/*"
  to = "https://ecohack-macroinvertebrates.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200